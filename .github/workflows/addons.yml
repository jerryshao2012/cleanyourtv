name: Add-ons

# Builds only what changed under addons/. Separate from CI on purpose: an add-on can't block or
# slow the launcher's build, and the launcher's size gate never sees add-on code.
on:
  pull_request:
    paths: ["addons/**"]
  push:
    branches: [main]
    paths: ["addons/**"]

permissions:
  contents: read

jobs:
  build:
    name: Build changed add-ons
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Build each add-on that changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD -- addons | awk -F/ 'NF>2 {print $2}' | sort -u)
          [ -z "$changed" ] && { echo "no add-on changed"; exit 0; }
          for a in $changed; do
            [ -d "addons/$a" ] || continue
            [ -f "addons/$a/gradlew" ] || { echo "addons/$a has no gradlew"; exit 1; }
            echo "::group::addons/$a"
            (cd "addons/$a" && chmod +x gradlew && ./gradlew --no-daemon assembleRelease)
            echo "::endgroup::"
          done
